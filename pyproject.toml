[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heimdall-guard"
version = "0.1.0"
description = "Project Heimdall: an action-control gateway and tamper-evident audit trail for AI agents"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Team Fishbowl, CSCE 477" }]
dependencies = [
    "mcp>=2.3,<3",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.40"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
heimdall = "heimdall.cli:main"

[tool.setuptools.packages.find]
include = ["heimdall*", "demo*"]

[tool.setuptools.package-data]
heimdall = ["dashboard/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
